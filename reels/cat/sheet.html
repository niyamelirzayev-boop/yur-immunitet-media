<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800;900&family=Manrope:wght@700;800&display=swap"><script src="cat.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#F3EFE6;width:2200px;padding:60px;font-family:Manrope;color:#0F1B2D}
h1{font:900 60px Unbounded}h1 span{color:#E8452C}.sub{font:700 26px Manrope;opacity:.65;margin:8px 0 30px}
.top{display:flex;gap:40px;align-items:flex-end}.hero{background:#FFE14D;border-radius:30px;padding:30px 40px 10px}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;flex:1}.c{background:#fff;border-radius:22px;padding:14px 10px 12px;text-align:center}
.c b{display:block;font:800 22px Manrope;margin-top:4px}</style></head><body>
<h1>Кот <span>Статья</span></h1><div class="sub">Нарисован в коде, без генераторов · эмоции переключаются параметрами</div>
<div class="top"><div class="hero" id="hero"></div><div class="row" id="row"></div></div>
<script>
document.getElementById('hero').innerHTML=cat({w:520});
const E=[["Скучающий (базовый)",{}],["Сарказм",{brows:'raise',eyes:'squint',mouth:'smirk'}],["Шок",{eyes:'wide',brows:'up',mouth:'o',ears:'back',sweat:true,glasses:false}],["Злой",{eyes:'squint',brows:'angry',mouth:'frown',ears:'back'}],
["Зевает",{eyes:'closed',brows:'flat',mouth:'yawn'}],["Довольный",{eyes:'happy',brows:'up',mouth:'grin',blush:true}],["Подмигивает",{eyes:'wink',brows:'raise',mouth:'smirk',paw:'point'}],["Объясняет",{eyes:'open',brows:'raise',mouth:'flat',paw:'up'}]];
document.getElementById('row').innerHTML=E.map(([n,o])=>`<div class="c">${cat(Object.assign({w:300},o))}<b>${n}</b></div>`).join('');
</script></body></html>
